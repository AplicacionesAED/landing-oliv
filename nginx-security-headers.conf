# Cabeceras de seguridad. Se incluye en el server y en cada location que declare su
# propio add_header (nginx NO hereda add_header si el location define alguno).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://js.hsforms.net https://*.hsforms.net https://*.hubspot.com https://*.hs-scripts.com https://*.hs-analytics.net https://*.hsadspixel.net https://*.hscollectedforms.net https://*.hs-banner.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://google.com/recaptcha/ https://recaptcha.net/recaptcha/ https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.doubleclick.net https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com https://*.hubapi.com https://*.hs-analytics.net https://*.hscollectedforms.net https://*.hs-banner.com https://www.google.com/recaptcha/ https://www.facebook.com; frame-src https://www.googletagmanager.com https://www.google.com/recaptcha/ https://recaptcha.google.com https://recaptcha.net https://www.recaptcha.net https://*.hsforms.net https://*.hsforms.com https://*.hubspot.com; form-action 'self' https://*.hsforms.com https://*.hubspot.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
